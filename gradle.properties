# JVM. Build requires a JDK (not the system JRE 26, which lacks javac).
# Locally invoke Gradle with JAVA_HOME=/usr/lib/jvm/java-21-openjdk; CI uses
# Temurin 21. We deliberately do NOT pin org.gradle.java.home here so the same
# properties work locally and in CI.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
